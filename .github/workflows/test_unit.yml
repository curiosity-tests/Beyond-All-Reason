name: Run Unit Tests

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

run-name: "Run Unit Tests ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  busted:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - name: Install Lua 5.1
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends lua5.1 liblua5.1-0-dev

    - name: Install Lux
      env:
        LUX_VERSION: '0.28.3'
      run: |
        # Fetch the prebuilt `lx` straight from the release page. Resolving
        # it through cargo-binstall (or the lux action) goes via the GitHub
        # API, which sporadically rate-limits unauthenticated runners;
        # release downloads don't count against that limit.
        curl -L --proto '=https' --tlsv1.2 -sSf \
          "https://github.com/nvim-neorocks/lux/releases/download/v${LUX_VERSION}/lx-x86_64-unknown-linux-gnu.tar.gz" \
          | sudo tar -xz -C /usr/local/bin lx
        lx --version

    - name: Cache Lux dependencies
      uses: actions/cache@v4
      with:
        path: .lux
        key: lux-5.1-${{ runner.os }}-${{ hashFiles('lux.lock') }}
        restore-keys: |
          lux-5.1-${{ runner.os }}-

    - name: Run busted
      run: lx --lua-version 5.1 test
